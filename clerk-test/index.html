<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Take Back Control of Your Time</title>
    <style>
      body {
        background: #000;
        color: #fff;
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Space Grotesk', sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 2rem;
        text-align: center;
      }
      #login-btn {
        font-size: 1.5rem;
        padding: 1rem 2.5rem;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 1.5rem;
        transition: background 0.2s, color 0.2s;
      }
      #login-btn:hover {
        background: #222;
        color: #fff;
      }
      #sign-in-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.7);
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      #sign-in {
        background: #111;
        border-radius: 12px;
        box-shadow: 0 4px 32px rgba(0,0,0,0.5);
        padding: 2rem;
        min-width: 350px;
        min-height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #close-modal {
        position: absolute;
        top: 30px;
        right: 40px;
        font-size: 2rem;
        color: #fff;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 1100;
      }
      #pay-link {
        display: none;
        margin-top: 2rem;
        font-size: 1.2rem;
        color: #fff;
        background: #4a9eff;
        border: none;
        border-radius: 8px;
        padding: 1rem 2.5rem;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s, color 0.2s;
      }
      #pay-link:hover {
        background: #222;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Take Back Control of Your Time</h1>
      <button id="login-btn">Login</button>
      <a id="pay-link" href="/payment.html">Go to Payment</a>
    </div>
    <div id="sign-in-modal">
      <button id="close-modal">&times;</button>
      <div id="sign-in"></div>
    </div>
    <script>
      const publishableKey = 'pk_test_ZWFzeS1vY2Vsb3QtOTguY2xlcmsuYWNjb3VudHMuZGV2JA';
      const loginBtn = document.getElementById('login-btn');
      const signInModal = document.getElementById('sign-in-modal');
      const closeModal = document.getElementById('close-modal');
      const payLink = document.getElementById('pay-link');
      let clerkLoaded = false;
      let clerkInstance = null;

      function showModal() {
        signInModal.style.display = 'flex';
        if (!clerkLoaded) {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
          script.async = true;
          script.onload = () => {
            clerkInstance = new window.Clerk(publishableKey);
            clerkInstance.load().then(() => {
              clerkInstance.mountSignIn(document.getElementById('sign-in'));
            });
            clerkLoaded = true;
          };
          document.head.appendChild(script);
        } else {
          if (clerkInstance) {
            clerkInstance.mountSignIn(document.getElementById('sign-in'));
          }
        }
      }
      function hideModal() {
        signInModal.style.display = 'none';
      }
      loginBtn.addEventListener('click', showModal);
      closeModal.addEventListener('click', hideModal);
      signInModal.addEventListener('click', (e) => {
        if (e.target === signInModal) hideModal();
      });
      // Optionally, check Clerk session and show/hide pay link
      window.addEventListener('DOMContentLoaded', () => {
        const checkSession = () => {
          if (clerkInstance && clerkInstance.session) {
            loginBtn.style.display = 'none';
            payLink.style.display = 'inline-block';
          } else {
            loginBtn.style.display = 'inline-block';
            payLink.style.display = 'none';
          }
        };
        if (clerkInstance) {
          clerkInstance.addListener('session', checkSession);
          checkSession();
        }
      });
    </script>
  </body>
</html>
