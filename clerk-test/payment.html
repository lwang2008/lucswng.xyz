<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment</title>
    <style>
      body {
        background: #000;
        color: #fff;
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Space Grotesk', sans-serif;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 2rem;
      }
      .pay-btn {
        font-size: 1.5rem;
        padding: 1rem 2.5rem;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 1.5rem;
        transition: background 0.2s, color 0.2s;
      }
      .pay-btn:hover {
        background: #222;
        color: #fff;
      }
    </style>
    <script src="https://js.stripe.com/v3/"></script>
  </head>
  <body>
    <h1>Complete Your Payment</h1>
    <p>To access premium features, please complete your payment below.</p>
    <button class="pay-btn" id="payBtn">Pay with Card</button>
    <script type="module" src="/payment.js"></script>
  </body>
</html>
