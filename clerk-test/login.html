<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register</title>
    
    <!-- Set Clerk publishable key globally BEFORE loading Clerk script -->
    <script>
      window.__clerk_publishable_key = 'pk_test_ZWFzeS1vY2Vsb3QtOTguY2xlcmsuYWNjb3VudHMuZGV2JA';
    </script>
    
    <!-- Load Clerk CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
    
    <style>
      body {
        background: #000;
        color: #fff;
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Space Grotesk', sans-serif;
      }
      #sign-in {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 350px;
        min-height: 400px;
        background: #111;
        border-radius: 12px;
        box-shadow: 0 4px 32px rgba(0,0,0,0.5);
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div id="sign-in"></div>
    
    <script>
      function getRedirectUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('redirect_url') || '/payment.html';
      }

      let clerkLoaded = false;

      function ensureClerkLoaded(cb) {
        if (clerkLoaded) {
          cb();
          return;
        }
        
        const check = setInterval(() => {
          if (window.Clerk && typeof window.Clerk.load === 'function') {
            clearInterval(check);
            window.Clerk.load().then(() => {
              clerkLoaded = true;
              cb();
            });
          }
        }, 50);
      }

      // Initialize Clerk and mount sign-in
      ensureClerkLoaded(() => {
        if (window.Clerk.user) {
          window.location.href = getRedirectUrl();
          return;
        }

        window.Clerk.mountSignIn(document.getElementById('sign-in'), {
          fallbackRedirectUrl: getRedirectUrl()
        });

        window.Clerk.addListener('user', (user) => {
          if (user) {
            window.location.href = getRedirectUrl();
          }
        });
      });
    </script>
  </body>
</html>
